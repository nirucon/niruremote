[package]
name = "niruremote"
version = "0.2.0"
edition = "2024"
rust-version = "1.85"
description = "Graphical remote desktop for the NIRUX suite over Tailscale and SSH"
license = "MIT"
repository = "https://github.com/nirucon/niruremote"
readme = "README.md"

[dependencies]
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
strip = true
lto = true
codegen-units = 1
